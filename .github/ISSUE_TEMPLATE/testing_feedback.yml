name: Benchmark or testing feedback
description: Share a measured comparison, an inconclusive result, or an installation test.
title: "[Testing]: "
body:
  - type: markdown
    attributes:
      value: "For paired measurements, follow docs/BENCHMARK.md and use docs/BENCHMARK_RESULT_TEMPLATE.md. Scheduler estimates are not measured savings. Missing measurements should be unknown, not zero."
  - type: dropdown
    id: kind
    attributes:
      label: Kind of feedback
      options:
        - Installation or telemetry availability test
        - Paired real-world measurement
        - Inconclusive or negative measurement
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and method
      description: OS, Node/Codex versions, project commit, install method, task source and model/effort when relevant. No private account details.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results and reproduction
      description: Paste the filled measurement template for a benchmark, or commands/output for an installation test. Include quality checks, deferrals, resets, other activity, and missing/stale data. Never paste complete private logs or credentials.
    validations:
      required: true
  - type: textarea
    id: interpretation
    attributes:
      label: Interpretation and limitations
      description: What do the observations support, and what remains uncertain?
    validations:
      required: true
