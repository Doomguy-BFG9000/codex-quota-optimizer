name: Feature or documentation suggestion
description: Propose an improvement, ask a question, or identify confusing instructions.
title: "[Idea]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or question
      description: What are you trying to do, and where does the current behavior or documentation fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Include an example of the desired behavior and alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Would you like to contribute?
      description: Optional. You do not need to implement your suggestion to submit it.
